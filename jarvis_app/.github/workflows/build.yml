name: Build Jarvis APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Get packages
        run: |
          cd jarvis_app
          flutter pub get

      - name: Build APK
        run: |
          cd jarvis_app
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: jarvis-apk
          path: jarvis_app/build/app/outputs/flutter-apk/app-debug.apk
